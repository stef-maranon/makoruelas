<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070d1c">
<title>Realidad Aumentada</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root { --acento:#3b82f6; --acento2:#22d3ee; --fondo:#070d1c; --texto:#e6eefc; --suave:#8ea3c4; }
  * { box-sizing:border-box; }
  /* Fondo transparente: así se ve la cámara detrás del contenido */
  html,body { margin:0; height:100%; overflow:hidden; background:transparent; color:var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hidden, .oculto { display:none !important; }

  .pantalla { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:24px; background:radial-gradient(circle at 50% 30%, #12306a 0%, var(--fondo) 70%); }
  .tarjeta { max-width:380px; width:100%; text-align:center; }
  .logo { width:72px; height:72px; margin:0 auto 20px; border-radius:20px; display:grid; place-items:center;
    background:linear-gradient(135deg, #2563eb, var(--acento2)); font-size:34px; box-shadow:0 10px 40px #22d3ee55; }
  h1 { font-size:26px; margin:0 0 10px; letter-spacing:-.02em; }
  p { color:var(--suave); line-height:1.5; margin:0 0 22px; }
  button.principal { width:100%; padding:16px; border:0; border-radius:14px; font-size:17px; font-weight:600;
    background:linear-gradient(135deg, #2563eb, #0ea5e9); color:#fff; cursor:pointer; box-shadow:0 8px 24px #2563eb66; }
  button.principal:disabled { opacity:.5; }
  .nota { font-size:13px; margin-top:16px; }

  /* Guía de escaneo */
  #escaneando { position:fixed; inset:0; z-index:20; pointer-events:none; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; }
  .marco { width:70vw; max-width:320px; aspect-ratio:3/4; position:relative; }
  .marco i { position:absolute; width:40px; height:40px; border:4px solid var(--acento2); filter:drop-shadow(0 0 6px #22d3ee); border-radius:6px; }
  .marco i:nth-child(1){ top:0; left:0; border-right:0; border-bottom:0; }
  .marco i:nth-child(2){ top:0; right:0; border-left:0; border-bottom:0; }
  .marco i:nth-child(3){ bottom:0; left:0; border-right:0; border-top:0; }
  .marco i:nth-child(4){ bottom:0; right:0; border-left:0; border-top:0; }
  .marco::after { content:""; position:absolute; left:8%; right:8%; height:3px; background:var(--acento2);
    box-shadow:0 0 18px var(--acento2); animation:barrido 2.2s ease-in-out infinite; }
  @keyframes barrido { 0%,100%{ top:6% } 50%{ top:92% } }
  .pildora { background:#07101fcc; border:1px solid #22d3ee55; padding:10px 18px; border-radius:99px; font-size:15px; backdrop-filter:blur(6px); }

  /* Barra inferior */
  #barra { position:fixed; left:16px; right:16px; bottom:max(20px, env(safe-area-inset-bottom)); z-index:30;
    display:flex; gap:10px; justify-content:center; }
  #barra button, #barra a { padding:12px 18px; border-radius:99px; border:0; font-size:15px; font-weight:600;
    background:#07101fcc; color:#fff; text-decoration:none; backdrop-filter:blur(6px); border:1px solid #22d3ee44; }
  #barra a { background:linear-gradient(135deg, #2563eb, #0ea5e9); border-color:transparent; }

</style>
</head>
<body>

<div id="inicio" class="pantalla">
  <div class="tarjeta">
    <div class="logo">✦</div>
    <h1 id="titulo">Realidad aumentada</h1>
    <p id="descripcion">Apunta la cámara a la imagen y mira cómo cobra vida.</p>
    <button id="btnComenzar" class="principal" disabled>Cargando…</button>
    <p class="nota">Te pediremos permiso para usar la cámara. Sube el volumen 🔊</p>
  </div>
</div>

<div id="error" class="pantalla oculto">
  <div class="tarjeta">
    <div class="logo">!</div>
    <h1 id="errorTitulo">Algo salió mal</h1>
    <p id="errorTexto"></p>
  </div>
</div>

<!-- MindAR muestra/oculta este elemento mientras busca la imagen -->
<div id="escaneando" class="hidden">
  <div class="marco"><i></i><i></i><i></i><i></i></div>
  <div class="pildora">Apunta a la imagen</div>
</div>

<div id="barra" class="oculto">
  <button id="btnSonido" class="oculto">🔇 Activar sonido</button>
  <a id="btnEnlace" class="oculto" target="_blank" rel="noopener"></a>
</div>

<div id="medios" style="display:none"></div>

<script>
/* ---------- Componente: reproduce animaciones incluidas en modelos .glb ---------- */
AFRAME.registerComponent('animar-modelo', {
  init() {
    this.mixer = null;
    this.el.addEventListener('model-loaded', (e) => {
      const modelo = e.detail.model;
      const clips = modelo.animations || [];
      if (!clips.length) return;
      this.mixer = new AFRAME.THREE.AnimationMixer(modelo);
      clips.forEach((c) => this.mixer.clipAction(c).play());
    });
  },
  tick(t, dt) { if (this.mixer) this.mixer.update(dt / 1000); }
});

/* ---------- Componente: video con recorte, giro, fondo transparente y fundido ---------- */
AFRAME.registerComponent('video-ar', {
  schema: {
    video: { type: 'selector' },
    modo: { default: 'ninguno' },      // ninguno | negro | verde | azul
    tolerancia: { default: 0.1 },
    suavidad: { default: 0.08 },
    recorte: { default: '0,0,1,1' },   // zona visible del video: izq, arriba, der, abajo (0 a 1)
    giro: { default: 0 },              // 0 | 90 | 180 | 270
    fundido: { default: 0 },           // ms para aparecer con fundido (0 = sin fundido)
    radio: { default: 0 }              // esquinas redondeadas: 0 = rectas, 0.5 = máximo
  },
  init() {
    const THREE = AFRAME.THREE;
    const d = this.data;
    const tex = new THREE.VideoTexture(d.video);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    const r = String(d.recorte).split(',').map(Number);
    const modo = d.modo === 'negro' ? 1 : (d.modo === 'verde' || d.modo === 'azul') ? 2 : 0;
    this.material = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: tex },
        modo: { value: modo },
        clave: { value: d.modo === 'azul' ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0) },
        tol: { value: Number(d.tolerancia) },
        suave: { value: Number(d.suavidad) },
        rec: { value: new THREE.Vector4(r[0] || 0, r[1] || 0, r[2] ?? 1, r[3] ?? 1) },
        giro: { value: Math.round(Number(d.giro) / 90) % 4 },
        opacidad: { value: 1 },
        radio: { value: Math.min(0.5, Math.max(0, Number(d.radio) || 0)) },
        asp: { value: 1 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform sampler2D map; uniform int modo; uniform vec3 clave; uniform float tol; uniform float suave;
        uniform vec4 rec; uniform int giro; uniform float opacidad; uniform float radio; uniform float asp;
        varying vec2 vUv;
        vec2 croma(vec3 c) {
          return vec2(-0.169 * c.r - 0.331 * c.g + 0.5 * c.b, 0.5 * c.r - 0.419 * c.g - 0.081 * c.b);
        }
        void main() {
          // Punto en el video ya girado (coordenadas de arriba hacia abajo)
          float ru = mix(rec.x, rec.z, vUv.x);
          float rv = mix(rec.y, rec.w, 1.0 - vUv.y);
          vec2 o;
          if (giro == 1) o = vec2(rv, 1.0 - ru);
          else if (giro == 2) o = vec2(1.0 - ru, 1.0 - rv);
          else if (giro == 3) o = vec2(1.0 - rv, ru);
          else o = vec2(ru, rv);
          if (o.x < 0.0 || o.x > 1.0 || o.y < 0.0 || o.y > 1.0) discard;
          vec4 c = texture2D(map, vec2(o.x, 1.0 - o.y));
          float a = 1.0;
          if (modo == 1) {
            a = smoothstep(tol, tol + suave, max(c.r, max(c.g, c.b)));
          } else if (modo == 2) {
            a = smoothstep(tol, tol + suave, distance(croma(c.rgb), croma(clave)));
          }
          if (radio > 0.0) {
            // Esquinas redondeadas (medidas en proporción al lado más corto)
            vec2 mitad = vec2(0.5, 0.5 * asp);
            vec2 p = (vUv - 0.5) * vec2(1.0, asp);
            float r = radio * min(1.0, asp);
            vec2 q = abs(p) - mitad + r;
            float dd = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
            a *= 1.0 - smoothstep(-0.004, 0.0, dd);
          }
          a *= opacidad;
          if (a < 0.02) discard;
          gl_FragColor = vec4(c.rgb, a);
        }`,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    this.t0 = null;
    this.el.addEventListener('aparecer', () => {
      if (Number(this.data.fundido) > 0) { this.material.uniforms.opacidad.value = 0; this.t0 = performance.now(); }
    });
  },
  tick() {
    const m = this.el.getObject3D('mesh');
    if (m && m.material !== this.material) m.material = this.material;
    const g = this.el.getAttribute('geometry');
    if (g && g.width) this.material.uniforms.asp.value = g.height / g.width;
    if (this.t0 !== null) {
      const p = Math.min(1, (performance.now() - this.t0) / Number(this.data.fundido));
      this.material.uniforms.opacidad.value = p;
      if (p >= 1) this.t0 = null;
    }
  }
});

/* ---------- Configuración ---------- */
const params = new URLSearchParams(location.search);
const proyecto = (params.get('p') || '').replace(/[^a-zA-Z0-9_-]/g, '');
let base = `proyectos/${proyecto}/`;
const $ = (id) => document.getElementById(id);

let config = null;
let escena = null;
const todosLosMedios = [];     // audio y video de todas las fotos
const visibles = new Map();    // índice de foto -> datos

function mostrarError(titulo, texto) {
  $('inicio').classList.add('oculto');
  $('errorTitulo').textContent = titulo;
  $('errorTexto').textContent = texto;
  $('error').classList.remove('oculto');
}

function ruta(src) {
  if (!src) return '';
  return /^(https?:)?\/\//.test(src) ? src : base + src;
}

async function cargar() {
  if (!proyecto) {
    return mostrarError('Escanea un código QR',
      'Este enlace no indica qué experiencia abrir. Usa el QR o el enlace que te compartieron.');
  }
  // Busca el proyecto en "proyectos/nombre/" y, si no está, en "nombre/"
  for (const intento of [`proyectos/${proyecto}/`, `${proyecto}/`]) {
    try {
      const r = await fetch(intento + 'config.json', { cache: 'no-cache' });
      if (!r.ok) continue;
      config = await r.json();
      base = intento;
      break;
    } catch (e) { /* probar la siguiente ruta */ }
  }
  if (!config) {
    return mostrarError('No encontramos esta experiencia',
      `Revisa que exista la carpeta "proyectos/${proyecto}" con su config.json.`);
  }
  if (config.titulo) { $('titulo').textContent = config.titulo; document.title = config.titulo; }
  if (config.descripcion) $('descripcion').textContent = config.descripcion;
  construirEscena();
}

/* ---------- Capas ---------- */
function crearCapa(c, id) {
  const pos = c.posicion || '0 0 0';
  const rot = c.rotacion || '0 0 0';

  if (c.tipo === 'video') {
    const alFinal = c.alFinal || (c.repetir === false ? 'parar' : 'repetir');
    const v = document.createElement('video');
    v.id = 'v' + id;
    v.src = ruta(c.src);
    v.loop = alFinal === 'repetir' && c.fin == null;
    v.muted = true;
    v.preload = 'auto';
    v.crossOrigin = 'anonymous';
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    $('medios').appendChild(v);

    const ancho = Number(c.ancho) || 1;
    const plano = document.createElement('a-plane');
    plano.setAttribute('width', ancho);
    plano.setAttribute('height', c.alto || ancho * 0.5625);
    plano.setAttribute('position', pos);
    plano.setAttribute('rotation', rot);
    plano.setAttribute('material', 'shader: flat; transparent: true');
    const recorte = Array.isArray(c.recorte) ? c.recorte.join(',') : '0,0,1,1';
    plano.setAttribute('video-ar',
      `video: #${v.id}; modo: ${c.quitarFondo || 'ninguno'}; ` +
      `tolerancia: ${c.tolerancia ?? (c.quitarFondo === 'negro' ? 0.1 : 0.12)}; ` +
      `recorte: ${recorte}; giro: ${Number(c.giro) || 0}; fundido: ${c.aparicion === 'fundido' ? (c.fundido || 700) : 0}; ` +
      `radio: ${Number(c.radio) || 0}`);
    if (!c.alto) {
      v.addEventListener('loadedmetadata', () => {
        if (v.videoWidth) plano.setAttribute('height', ancho * v.videoHeight / v.videoWidth);
      });
    }

    // Tiempos: inicio, fin, velocidad y qué pasa al terminar
    const inicio = Number(c.inicio) || 0;
    const fin = c.fin != null ? Number(c.fin) : null;
    const medio = { el: v, reiniciar: !!c.reiniciar, inicio, fin, alFinal, plano,
      velocidad: Number(c.velocidad) || 1, terminado: false };
    const terminar = () => {
      if (alFinal === 'repetir') { v.currentTime = inicio; v.play().catch(() => {}); return; }
      v.pause();
      medio.terminado = true;
      if (alFinal === 'desaparecer') plano.setAttribute('visible', false);
    };
    v.addEventListener('timeupdate', () => { if (fin != null && v.currentTime >= fin && !medio.terminado) terminar(); });
    v.addEventListener('ended', () => { if (!v.loop) terminar(); });
    todosLosMedios.push(medio);

    // El video vive en una "raíz" con su posición y giro; los efectos se aplican dentro de ella
    if (c.emerger === true || c.emerger === 'true') {
      // Efecto pop-up: el video se levanta desde la foto como un libro desplegable
      const angulo = Number(c.angulo ?? 90);
      const [px, , pz] = pos.split(/\s+/).map(Number);
      const bisagra = document.createElement('a-entity');
      bisagra.setAttribute('position', `${px || 0} ${c.base ?? -0.35} ${pz || 0.01}`);
      bisagra.setAttribute('rotation', '0 0 0');
      bisagra.setAttribute('animation__emerger',
        `property: rotation; from: 0 0 0; to: ${angulo} 0 0; dur: ${c.duracion || 1100}; easing: easeOutBack; startEvents: emerger`);
      bisagra.setAttribute('animation__crecer',
        `property: scale; from: 0.2 0.2 0.2; to: 1 1 1; dur: ${c.duracion || 1100}; easing: easeOutCubic; startEvents: emerger`);
      const subir = () => plano.setAttribute('position', `0 ${Number(plano.getAttribute('height')) / 2} 0`);
      plano.setAttribute('position', `0 ${(c.alto || ancho * 0.5625) / 2} 0`);
      plano.setAttribute('rotation', '0 0 0');
      v.addEventListener('loadedmetadata', () => setTimeout(subir, 0));
      bisagra.appendChild(plano);
      return { el: bisagra, medio, efecto: bisagra };
    }

    const raiz = document.createElement('a-entity');
    raiz.setAttribute('position', pos);
    raiz.setAttribute('rotation', rot);
    plano.setAttribute('position', '0 0 0');
    plano.setAttribute('rotation', '0 0 0');

    if (c.emerger === 'flotar' || c.aparicion === 'flotar') {
      // Sale hacia la cámara (en la dirección hacia donde mira el video)
      const altura = Number(c.altura ?? 0.15);
      const capa = document.createElement('a-entity');
      capa.setAttribute('animation__emerger',
        `property: position; from: 0 0 0; to: 0 0 ${altura}; dur: ${c.duracion || 1000}; easing: easeOutBack; startEvents: emerger`);
      capa.setAttribute('animation__crecer',
        `property: scale; from: 0.9 0.9 0.9; to: ${c.crecer || 1.1} ${c.crecer || 1.1} 1; dur: ${c.duracion || 1000}; easing: easeOutCubic; startEvents: emerger`);
      capa.appendChild(plano);
      capa.reiniciarEfecto = () => { capa.setAttribute('position', '0 0 0'); capa.setAttribute('scale', '0.9 0.9 0.9'); };
      raiz.appendChild(capa);
      return { el: raiz, medio, efecto: capa };
    }
    raiz.appendChild(plano);
    return { el: raiz, medio };
  }

  if (c.tipo === 'audio') {
    const a = document.createElement('audio');
    a.src = ruta(c.src);
    a.loop = c.repetir !== false;
    a.preload = 'auto';
    a.volume = c.volumen != null ? Number(c.volumen) : 1;
    $('medios').appendChild(a);
    const medio = { el: a, reiniciar: !!c.reiniciar };
    todosLosMedios.push(medio);
    return { medio };
  }

  if (c.tipo === 'modelo') {
    const envoltura = document.createElement('a-entity');
    envoltura.setAttribute('position', pos);
    envoltura.setAttribute('rotation', rot);
    const m = document.createElement('a-gltf-model');
    m.setAttribute('src', ruta(c.src));
    const s = Number(c.escala) || 0.3;
    m.setAttribute('scale', `${s} ${s} ${s}`);
    if (c.animar !== false) m.setAttribute('animar-modelo', '');
    if (c.girar) m.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear');
    envoltura.appendChild(m);
    return { el: envoltura };
  }

  if (c.tipo === 'imagen') {
    const ancho = Number(c.ancho) || 1;
    const img = document.createElement('a-image');
    img.setAttribute('src', ruta(c.src));
    img.setAttribute('width', ancho);
    img.setAttribute('height', c.alto || ancho);
    img.setAttribute('position', pos);
    img.setAttribute('rotation', rot);
    img.setAttribute('material', 'transparent: true; alphaTest: 0.01; shader: flat');
    if (!c.alto) {
      const probe = new Image();
      probe.onload = () => img.setAttribute('height', ancho * probe.naturalHeight / probe.naturalWidth);
      probe.src = ruta(c.src);
    }
    return { el: img };
  }

  if (c.tipo === 'enlace' && c.url) {
    return { enlace: { texto: c.texto || 'Ver más', url: c.url } };
  }
  return {};
}

// Filtro anti-temblor de MindAR: filterMinCF bajo = menos temblor quieto; filterBeta alto = menos retraso al mover.
// rapido (recomendado): estable y ágil · muy-rapido: sin filtro casi (tiembla) · suave: muy estable con retraso
function filtroSeguimiento(modo) {
  if (modo === 'muy-rapido') return 'filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 2; missTolerance: 5';
  if (modo === 'suave') return 'filterMinCF: 0.0001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 5';
  return 'filterMinCF: 0.0001; filterBeta: 10; warmupTolerance: 3; missTolerance: 5';
}

function construirEscena() {
  const objetivos = config.objetivos || [];
  escena = document.createElement('a-scene');
  escena.setAttribute('mindar-image',
    `imageTargetSrc: ${base}targets.mind; autoStart: false; uiLoading: no; uiScanning: #escaneando; uiError: yes; ` +
    `maxTrack: ${config.maxSimultaneos || 1}; ${filtroSeguimiento(config.seguimiento)}`);
  escena.setAttribute('color-space', 'sRGB');
  escena.setAttribute('renderer', 'colorManagement: true; antialias: true; alpha: true');
  escena.setAttribute('vr-mode-ui', 'enabled: false');
  escena.setAttribute('device-orientation-permission-ui', 'enabled: false');

  const cam = document.createElement('a-camera');
  cam.setAttribute('position', '0 0 0');
  cam.setAttribute('look-controls', 'enabled: false');
  escena.appendChild(cam);

  const luzA = document.createElement('a-entity');
  luzA.setAttribute('light', 'type: ambient; intensity: 1.2');
  escena.appendChild(luzA);
  const luzD = document.createElement('a-entity');
  luzD.setAttribute('light', 'type: directional; intensity: 1.5');
  luzD.setAttribute('position', '0.5 1 1');
  escena.appendChild(luzD);

  objetivos.forEach((obj, i) => {
    const ent = document.createElement('a-entity');
    ent.setAttribute('mindar-image-target', `targetIndex: ${i}`);
    const datos = { medios: [], enlace: null, efectos: [] };
    (obj.capas || []).forEach((capa, j) => {
      const r = crearCapa(capa, `${i}_${j}`);
      if (r.el) ent.appendChild(r.el);
      if (r.medio) datos.medios.push(r.medio);
      if (r.enlace) datos.enlace = r.enlace;
      if (r.efecto) datos.efectos.push(r.efecto);
    });
    ent.addEventListener('targetFound', () => alEncontrar(i, datos));
    ent.addEventListener('targetLost', () => alPerder(i, datos));
    escena.appendChild(ent);
  });

  escena.addEventListener('loaded', () => {
    $('btnComenzar').disabled = false;
    $('btnComenzar').textContent = 'Comenzar';
  });
  escena.addEventListener('arError', () => {
    mostrarError('No pudimos abrir la cámara',
      'Revisa que diste permiso de cámara y que abriste el enlace en Safari o Chrome (no dentro de Instagram o WhatsApp).');
  });
  document.body.appendChild(escena);
}

/* ---------- Reproducción ---------- */
function reproducir(medio) {
  const el = medio.el;
  const inicio = medio.inicio || 0;
  if (medio.terminado) {
    if (!medio.reiniciar) return;           // se quedó detenido: no vuelve a empezar
    medio.terminado = false;
    el.currentTime = inicio;
  }
  if (medio.plano) medio.plano.setAttribute('visible', true);
  if (medio.reiniciar || el.currentTime < inicio || (medio.fin != null && el.currentTime >= medio.fin)) {
    el.currentTime = inicio;
  }
  if (medio.velocidad) el.playbackRate = medio.velocidad;
  if (medio.plano) medio.plano.emit('aparecer');
  const p = el.play();
  if (p && p.catch) {
    p.catch(() => {
      // El navegador bloqueó el sonido: reproducimos en silencio y ofrecemos activarlo
      el.muted = true;
      el.play().catch(() => {});
      $('btnSonido').classList.remove('oculto');
      actualizarBarra();
    });
  }
}

function alEncontrar(i, datos) {
  visibles.set(i, datos);
  datos.efectos.forEach((e) => {
    if (e.reiniciarEfecto) e.reiniciarEfecto(); else e.setAttribute('rotation', '0 0 0');
    e.emit('emerger');
  });
  datos.medios.forEach(reproducir);
  actualizarBarra();
}

function alPerder(i, datos) {
  visibles.delete(i);
  datos.medios.forEach((m) => m.el.pause());
  datos.efectos.forEach((e) => {
    if (e.reiniciarEfecto) e.reiniciarEfecto();
    else { e.setAttribute('rotation', '0 0 0'); e.setAttribute('scale', '0.2 0.2 0.2'); }
  });
  actualizarBarra();
}

function actualizarBarra() {
  let enlace = null;
  visibles.forEach((d) => { if (d.enlace) enlace = d.enlace; });
  const a = $('btnEnlace');
  if (enlace) { a.href = enlace.url; a.textContent = enlace.texto; a.classList.remove('oculto'); }
  else a.classList.add('oculto');
  const hayAlgo = enlace || !$('btnSonido').classList.contains('oculto');
  $('barra').classList.toggle('oculto', !hayAlgo);
}

// Un toque del usuario "desbloquea" el audio y video en iPhone y Android
function desbloquearMedios() {
  todosLosMedios.forEach(({ el }) => {
    if (el.tagName === 'VIDEO') el.muted = false;
    const p = el.play();
    if (p && p.then) p.then(() => { el.pause(); el.currentTime = 0; }).catch(() => {});
  });
}

$('btnComenzar').addEventListener('click', () => {
  desbloquearMedios();
  $('inicio').classList.add('oculto');
  escena.systems['mindar-image-system'].start();
});

$('btnSonido').addEventListener('click', () => {
  todosLosMedios.forEach(({ el }) => { el.muted = false; });
  visibles.forEach((d) => d.medios.forEach((m) => m.el.play().catch(() => {})));
  $('btnSonido').classList.add('oculto');
  actualizarBarra();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) todosLosMedios.forEach(({ el }) => el.pause());
});

cargar();
</script>
